<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assembly Factory</title>
  <meta name="description" content="Assembly Factory — building things" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%99%EF%B8%8F</text></svg>" />
  <style>
    :root {
      --bg: #0b0d10;
      --fg: #f5f5f4;
      --muted: #a3a3a3;
      --accent: #739916;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header,
    main,
    footer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    header {
      padding-top: 2.5rem;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .logo span {
      color: var(--accent);
    }

    .logo img {
      width: 3rem;
      height: 3rem;
      margin-right: 0.75rem;
    }

    main {
      flex: 1;
      padding-top: 4rem;
      padding-bottom: 4rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }

    .lede {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      max-width: 36rem;
    }

    .cta {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: opacity 0.15s ease;
    }

    .cta:hover {
      opacity: 0.85;
    }

    footer {
      padding-top: 2rem;
      padding-bottom: 2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--fg);
    }
  </style>
</head>

<body>
  <header>
    <div class="logo"><img src="af_logo.svg">ASSEMBLY FACTORY</div>
  </header>

  <main>
    <div class="code">ERROR 404</div>
    <p class="lede">
      The page you're looking for doesn't exist, or it's been moved. Let's get
      you back to something that does.
    </p>
    <a class="cta" href="/">Back to home</a>
  </main>

  <footer>
    <span>&copy;
      <script>document.write(new Date().getFullYear())</script> AssemblyFactory LLC
    </span>
    <a href="mailto:hello@assemblyfactory.com">hello@assemblyfactory.com</a>
  </footer>
</body>

</html>
